name: Sync releases

# Every day (08:17 Israel time): pull K.O's catalogue from Spotify and SoundCloud and commit any change
# to assets/js/auto-releases.js. Run it by hand from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: sync-releases

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch releases
        run: node scripts/sync-releases.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      - name: Commit changes
        run: |
          if git diff --quiet; then echo "Nothing new"; exit 0; fi
          git config user.name "ko-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/auto-releases.js
          git commit -m "Sync releases from Spotify and SoundCloud"
          git push
