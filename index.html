<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>K.O — DJ & Producer</title>
  <meta name="description" content="K.O — Israeli DJ & producer. New releases, live sets, mixes and booking.">
  <meta name="theme-color" content="#060606">
  <meta property="og:type" content="website">
  <meta property="og:title" content="K.O — DJ & Producer">
  <meta property="og:description" content="New releases, live sets, mixes and booking.">
  <meta property="og:image" content="assets/media/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/media/logo-ko.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- HERO -->
  <header class="hero" id="top">
    <div class="hero-bg" aria-hidden="true">
      <div class="hero-glow"></div>
      <div class="hero-photo"></div>
      <div class="hero-beams"><i></i><i></i><i></i></div>
    </div>

    <div class="hero-inner">
      <img class="logo" src="assets/media/logo-ko.png" alt="K.O" width="1054" height="538" fetchpriority="high">

      <div class="cube-stage" id="cubeStage" aria-label="Live clips. Drag to spin, tap a face to watch">
        <div class="cube" id="cube"></div>
        <div class="cube-floor" aria-hidden="true"></div>
      </div>

      <nav class="platforms" id="heroPlatforms" aria-label="Listen on"></nav>
    </div>

    <a class="scroll-cue" href="#out-now" aria-label="Scroll to music"><span></span></a>
  </header>

  <!-- STICKY NAV -->
  <nav class="chips" id="chips" aria-label="Sections">
    <a href="#out-now">Out Now</a>
    <a href="#releases">Latest Releases</a>
    <a href="#live">Live 2025</a>
    <a href="#mixes">Videos & Mixes</a>
    <a href="#booking">Booking</a>
  </nav>

  <main>
    <section id="out-now" class="section">
      <h2 class="section-head reveal">Out Now</h2>
      <div class="featured" id="featured"></div>
    </section>

    <section id="releases" class="section">
      <h2 class="section-head reveal">Latest Releases</h2>
      <div class="grid" id="releaseGrid"></div>
    </section>

    <section id="live" class="section">
      <h2 class="section-head reveal">Live 2025</h2>
      <div class="live" id="liveGrid"></div>
    </section>

    <section id="mixes" class="section">
      <h2 class="section-head reveal">Videos &amp; Mixes</h2>
      <div class="mixes" id="mixList"></div>
    </section>

    <section id="booking" class="section">
      <div class="booking reveal">
        <h2>Booking / MGMT</h2>
        <a class="booking-mail" id="bookingMail"></a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <img src="assets/media/logo-ko.png" alt="K.O" class="footer-logo" loading="lazy" width="1054" height="538">
    <nav class="platforms platforms-sm" id="footPlatforms" aria-label="Social"></nav>
    <p>© <span id="year"></span> K.O. All rights reserved.</p>
  </footer>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" aria-label="Close">×</button>
    <div class="lb-frame" id="lbFrame"></div>
    <button class="lb-sound" id="lbSound" hidden>Sound on</button>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
