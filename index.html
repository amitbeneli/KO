<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- HERO -->
  <header class="hero" id="top">
    <div class="hero-bg" aria-hidden="true">
      <div class="hero-glow"></div>
      <div class="hero-photo"></div>
      <div class="hero-beams"><i></i><i></i><i></i></div>
    </div>

    <div class="hero-inner">
      <div class="logo-wrap"><img class="logo" src="assets/media/logo-ko.svg" alt="K.O" width="529" height="272" fetchpriority="high"></div>

      <div class="cube-stage" id="cubeStage" role="button" tabindex="0" aria-label="Live clips. Drag to spin, tap a face to watch">
        <div class="cube" id="cube"></div>
        <div class="cube-floor" aria-hidden="true"></div>
      </div>

      <nav class="platforms" id="heroPlatforms" aria-label="Listen on"></nav>
    </div>

    <a class="scroll-cue" href="#out-now" aria-label="Scroll to music"><span></span></a>
  </header>

  <!-- STICKY NAV -->
  <nav class="chips" id="chips" aria-label="Sections">
    <a href="#out-now">Out Now</a>
    <a href="#releases">Latest Releases</a>
    <a href="#live">Live 2025</a>
    <a href="#mixes">Videos & Mixes</a>
    <a href="#booking">Booking</a>
  </nav>

  <noscript>
    <p style="text-align:center;padding:40px 16px">Booking / MGMT: K.O@sako-mgmt.com · <a href="https://open.spotify.com/artist/4dalkrTraIcooInb3IR0Di">Spotify</a> · <a href="https://www.instagram.com/k.omusic">Instagram</a></p>
  </noscript>

  <main>
    <section id="out-now" class="section">
      <h2 class="section-head reveal">Out Now</h2>
      <div class="featured" id="featured"></div>
    </section>

    <section id="releases" class="section">
      <h2 class="section-head reveal">Latest Releases</h2>
      <div class="grid" id="releaseGrid"></div>
    </section>

    <section id="live" class="section">
      <h2 class="section-head reveal">Live 2025</h2>
      <div class="live" id="liveGrid"></div>
    </section>

    <section id="mixes" class="section">
      <h2 class="section-head reveal">Videos &amp; Mixes</h2>
      <div class="mixes" id="mixList"></div>
    </section>

    <section id="booking" class="section">
      <div class="booking reveal">
        <h2>Booking / MGMT</h2>
        <a class="booking-mail" id="bookingMail"></a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <img src="assets/media/logo-ko.svg" alt="K.O" class="footer-logo" loading="lazy" width="529" height="272">
    <nav class="platforms platforms-sm" id="footPlatforms" aria-label="Social"></nav>
    <p>© <span id="year"></span> K.O. All rights reserved.</p>
  </footer>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Live clip" hidden>
    <button class="lb-close" id="lbClose" aria-label="Close">×</button>
    <div class="lb-frame" id="lbFrame"></div>
    <button class="lb-sound" id="lbSound" hidden>Sound on</button>
  </div>
